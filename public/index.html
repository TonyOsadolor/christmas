<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Merry Christmas Streamer - Stream All time favorite Christmas Songs!">
    <meta name="keywords" content="Christmas, Music, Stream, Holiday Songs, Merry Christmas">
    <title>Merry Christmas Streamer</title>

    <link rel="icon" type="image/jpeg" href="christmas-logo.jpg">
    
    <!-- SweetAlert2 CDN Stylesheet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <style>
        /* Theme Variables: Dark (Default) */
        :root[data-theme="dark"] {
            --bg-color: #0f0f12;
            --card-bg: #18181c;
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --accent-color: #10b981;
            --accent-hover: #059669;
            --active-bg: #064e3b;
            --border-color: #27272a;
            --btn-bg: #27272a;
            --btn-hover: #3f3f46;
            --progress-bg: #27272a;
        }

        /* Theme Variables: Light */
        :root[data-theme="light"] {
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-primary: #18181b;
            --text-secondary: #71717a;
            --accent-color: #10b981;
            --accent-hover: #059669;
            --active-bg: #d1fae5;
            --border-color: #e4e4e7;
            --btn-bg: #f4f4f5;
            --btn-hover: #e4e4e7;
            --progress-bg: #e4e4e7;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            max-width: 480px;
            margin: 20px auto;
            padding: 16px;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
            user-select: none;
        }

        .player-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.25rem;
            margin: 0;
            letter-spacing: -0.025em;
        }

        .theme-toggle {
            background: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 8px;
            cursor: pointer;
        }

        /* Album Art & Equalizer View */
        .art-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 10px auto 16px auto;
            border-radius: 50%;
            background: linear-gradient(135deg, #10b981, #059669);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.25);
        }

        .vinyl-art {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #111;
            border: 4px solid #222;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            transition: transform 0.5s ease;
        }

        .art-container.playing .vinyl-art {
            animation: spin 8s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Equalizer Animation */
        .eq-bar-container {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 20px;
            justify-content: center;
            margin-bottom: 12px;
        }

        .eq-bar {
            width: 4px;
            background-color: var(--accent-color);
            border-radius: 2px;
            height: 4px;
            transition: height 0.2s;
        }

        .playing .eq-bar:nth-child(1) { animation: bounce 0.8s ease-in-out infinite alternate; }
        .playing .eq-bar:nth-child(2) { animation: bounce 0.6s ease-in-out infinite alternate 0.2s; }
        .playing .eq-bar:nth-child(3) { animation: bounce 1.1s ease-in-out infinite alternate 0.4s; }
        .playing .eq-bar:nth-child(4) { animation: bounce 0.7s ease-in-out infinite alternate 0.1s; }

        @keyframes bounce {
            0% { height: 4px; }
            100% { height: 20px; }
        }

        #now-playing {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0 0 16px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
        }

        /* Custom Seek Progress Bar */
        .progress-area {
            margin-bottom: 16px;
        }

        .progress-bar-container {
            height: 6px;
            background: var(--progress-bg);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: var(--accent-color);
            border-radius: 4px;
            transition: width 0.1s linear;
        }

        .time-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        /* Control Buttons */
        .controls-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 16px;
        }

        button.btn-ctrl {
            flex: 1;
            background-color: var(--btn-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 12px 8px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button.btn-ctrl:hover:not(:disabled) {
            background-color: var(--btn-hover);
        }

        button.btn-ctrl:active:not(:disabled) {
            transform: scale(0.98);
        }

        button.btn-ctrl:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        #play-btn {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            flex: 1.6;
            font-size: 0.95rem;
        }

        #play-btn:hover:not(:disabled) {
            background-color: var(--accent-hover);
        }

        .toggle-btn.active {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* Volume Controls */
        .volume-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 0 4px;
        }

        .volume-btn {
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0;
            color: var(--text-primary);
        }

        .volume-slider {
            flex: 1;
            height: 4px;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        /* Playlist View */
        h3 {
            font-size: 0.9rem;
            text-align: left;
            margin-bottom: 8px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        ul#playlist {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: left;
            max-height: 240px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.02);
        }

        ul#playlist::-webkit-scrollbar {
            width: 6px;
        }

        ul#playlist::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ul#playlist li {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.15s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        ul#playlist li:last-child {
            border-bottom: none;
        }

        ul#playlist li:hover {
            background-color: rgba(0, 0, 0, 0.04);
        }

        ul#playlist li.active {
            background-color: var(--active-bg);
            color: var(--accent-color);
            font-weight: bold;
            border-left: 4px solid var(--accent-color);
        }

        /* Hidden Native Audio Element */
        audio {
            display: none;
        }
    </style>
</head>

<body>
    <div class="player-card">
        <div class="header-row">
            <h1>Merry Christmas</h1>
            <button id="theme-toggle-btn" class="theme-toggle">🌙 Theme</button>
        </div>

        <!-- Album Art / Equalizer Display -->
        <div class="art-container" id="art-container">
            <div class="vinyl-art">🎄</div>
        </div>

        <div class="eq-bar-container" id="eq-container">
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
        </div>

        <div id="now-playing">Status: Ready to Stream</div>

        <!-- Custom Seeking Progress Area -->
        <div class="progress-area">
            <div class="progress-bar-container" id="progress-container">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
            <div class="time-labels">
                <span id="current-time">00:00</span>
                <span id="duration-time">00:00</span>
            </div>
        </div>

        <!-- Controls: Prev, Play, Next, Repeat, Shuffle -->
        <div class="controls-row">
            <button id="prev-btn" class="btn-ctrl">⏮</button>
            <button id="play-btn" class="btn-ctrl">▶ Play</button>
            <button id="next-btn" class="btn-ctrl">⏭</button>
            <button id="repeat-btn" class="btn-ctrl toggle-btn">🔁 Off</button>
            <button id="shuffle-btn" class="btn-ctrl toggle-btn">🔀</button>
        </div>

        <!-- Volume Control Row -->
        <div class="volume-row">
            <button id="mute-btn" class="volume-btn">🔊</button>
            <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="1">
        </div>

        <h3>Playlist</h3>
        <ul id="playlist">
            <li>Loading tracks from cloud...</li>
        </ul>
    </div>

    <!-- Hidden Native Audio Engine -->
    <audio id="audio-player" preload="auto"></audio>

    <!-- SweetAlert2 Library Script -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="app.js"></script>
</body>

</html>
